# Standalone Docker Compose file that pulls images from Docker Hub.
# Usage:
#   docker compose -f docker-compose.dockerhub.yml up -d
#
# Set DOCKERHUB_REPO and IMAGE_TAG in your .env file.
# DOCKERHUB_REPO should be your Docker Hub username, e.g. "johndoe".

services:
  caddy:
    image: caddy:2-alpine
    pull_policy: always
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      - web

  web:
    # Image published to Docker Hub by the CI workflow on every push to main.
    # Set DOCKERHUB_REPO=<dockerhub-username> and optionally
    # IMAGE_TAG=sha-<short-sha> in .env.
    image: ${DOCKERHUB_REPO}/better-personal-finance-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - API_INTERNAL_URL=http://api:4000
    networks:
      - frontend
      - backend
    depends_on:
      - api

  # Runs `prisma migrate deploy` once, then exits.
  # api waits for this to finish before starting.
  migrate:
    image: ${DOCKERHUB_REPO}/better-personal-finance-api:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["/bin/sh", "-c", "packages/db/node_modules/.bin/prisma migrate deploy --schema packages/db/prisma/schema.prisma"]
    env_file: .env
    environment:
      # env_file does not expand ${VAR} references; set composed values here
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    image: ${DOCKERHUB_REPO}/better-personal-finance-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - backups_data:/data/backups
    env_file: .env
    environment:
      - NODE_ENV=production
      - WEB_ORIGIN=https://${DOMAIN}
      # env_file does not expand ${VAR} references; override computed values here
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    # NOTE: Do NOT expose port 5432 to the host in production

  redis:
    image: redis:7-alpine
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backups_data:

networks:
  frontend:
  backend:
    internal: true # The backend network is NOT reachable from the host
